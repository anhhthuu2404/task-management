<abp-page [title]="'Danh sách Thẻ (Tags)'">
  <!-- Form Tìm kiếm & Lọc -->
  <abp-card>
    <abp-card-body>
      <form [formGroup]="searchForm" (keyup.enter)="search()" class="row mb-3">
        <div class="col-md-4 mb-2">
          <label class="form-label">Tìm từ khóa</label>
          <input type="text" class="form-control" formControlName="keyword" placeholder="Nhập tên..." />
        </div>
        <div class="col-md-4 mb-2">
          <label class="form-label">Lọc theo danh mục</label>
          <select class="form-select" formControlName="categoryId">
            <option [ngValue]="null">-- Tất cả danh mục --</option>
            <option *ngFor="let cat of categories" [ngValue]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>
        <div class="col-md-4 mb-2 d-flex align-items-end">
          <button type="button" class="btn btn-primary me-2" (click)="search()">
            <i class="fa fa-search me-1"></i> Tìm kiếm
          </button>
          <button type="button" class="btn btn-secondary me-2" (click)="reset()">
            <i class="fa fa-refresh me-1"></i> Làm mới
          </button>
          <button type="button" class="btn btn-success ms-auto" (click)="create()">
            <i class="fa fa-plus me-1"></i> Thêm mới
          </button>
        </div>
      </form>
    </abp-card-body>
  </abp-card>

  <!-- Bảng ngx-datatable dãn đều 100% -->
  <abp-card>
    <abp-card-body>
      <ngx-datatable
        [rows]="items.items"
        [count]="items.totalCount"
        [list]="list"
        [loadingIndicator]="loading"
        [columnMode]="'flex'"
        default
      >
        <!-- Cột Thao tác: Cố định độ rộng -->
        <ngx-datatable-column name="Thao tác" [sortable]="false" [flexGrow]="0" [minWidth]="120" [maxWidth]="120">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-primary" (click)="edit(row.id)" title="Sửa">
                <i class="fa fa-pencil"></i>
              </button>
              <button class="btn btn-danger" (click)="delete(row.id)" title="Xóa">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </ng-template>
        </ngx-datatable-column>
        
        <!-- Cột Tên Thẻ: Dãn 50% không gian còn lại -->
        <ngx-datatable-column name="Tên thẻ" prop="name" [sortable]="true" [flexGrow]="1">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="badge bg-primary text-white p-2">
              <i class="fa fa-tag me-1"></i> {{ row.name }}
            </span>
          </ng-template>
        </ngx-datatable-column>

        <!-- Cột Danh Mục: Dãn 50% không gian còn lại -->
        <ngx-datatable-column name="Danh mục" prop="categoryName" [sortable]="false" [flexGrow]="1">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="badge bg-secondary text-white p-2" *ngIf="getCategoryName(row)">
              <i class="fa fa-folder me-1"></i> {{ getCategoryName(row) }}
            </span>
            <span class="text-muted small fst-italic" *ngIf="!getCategoryName(row)">
              Chưa gán danh mục
            </span>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </abp-card-body>
  </abp-card>

  <!-- Modal Thêm/Sửa Thẻ -->
  <abp-modal [(visible)]="isModalOpen" [options]="modalOptions">
    <ng-template #abpHeader>
      <h3>{{ selected?.id ? 'Sửa Thẻ' : 'Thêm Thẻ Mới' }}</h3>
    </ng-template>

    <ng-template #abpBody>
      <form [formGroup]="form" (ngSubmit)="save()" id="tag-form">
        <div class="mb-3">
          <label class="form-label">Tên thẻ <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="name" placeholder="Nhập tên thẻ..." autofocus />
          <div *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="text-danger mt-1 small">
            Vui lòng nhập tên thẻ hợp lệ (tối đa 64 ký tự).
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Thuộc danh mục</label>
          <select class="form-select" formControlName="categoryId">
            <option [ngValue]="null">-- Không chọn --</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>
      </form>
    </ng-template>

    <ng-template #abpFooter>
      <button type="button" class="btn btn-secondary" abpClose>Hủy</button>
      <button type="submit" form="tag-form" class="btn btn-primary" [disabled]="isSaving || form?.invalid">
        <i class="fa fa-save me-1"></i> Lưu
      </button>
    </ng-template>
  </abp-modal>
</abp-page>
