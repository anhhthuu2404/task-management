<abp-page [title]="'::Menu:Categories' | abpLocalization">
  <abp-page-toolbar-container class="col">
    <div class="text-lg-end pt-2 pt-lg-0">
      <button class="btn btn-primary px-3 shadow-sm d-inline-flex align-items-center gap-1" type="button" (click)="createCategory()" *ngIf="canCreate">
        <i class="fa fa-plus-circle"></i> <span>{{ '::Create' | abpLocalization }}</span>
      </button>
    </div>
  </abp-page-toolbar-container>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <!-- Search Form -->
      <form [formGroup]="searchForm" (ngSubmit)="search()" class="mb-4">
        <div class="row g-3 align-items-center">
          <div class="col-md-8">
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0">
                <i class="fa fa-search text-muted"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                [placeholder]="'::Search' | abpLocalization"
                formControlName="filter"
              />
            </div>
          </div>
          <div class="col-md-4 d-flex gap-2 justify-content-md-end">
            <button type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-1 shadow-sm">
              <span>{{ '::Search' | abpLocalization }}</span>
            </button>
            <button type="button" class="btn btn-outline-secondary px-3 d-inline-flex align-items-center gap-1" (click)="reset()">
              <i class="fa fa-refresh"></i> <span>{{ '::Cancel' | abpLocalization }}</span>
            </button>
          </div>
        </div>
      </form>

      <!-- Data Table (Đã lược bỏ cột Trạng thái) -->
      <ngx-datatable
        [rows]="category.items"
        [count]="category.totalCount"
        [list]="list"
        default
      >
        <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span>{{ row?.name | abpLocalization }}</span>
          </ng-template>
        </ngx-datatable-column>
        
        <ngx-datatable-column [name]="'::Description' | abpLocalization" prop="description">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <span class="text-muted">{{ row?.description || '---' }}</span>
          </ng-template>
        </ngx-datatable-column>

        <!-- Cột Thao tác -->
        <ngx-datatable-column [name]="'::Actions' | abpLocalization" [sortable]="false" *ngIf="canEdit || canDelete">
          <ng-template let-row="row" ngx-datatable-cell-template>
            <div class="d-flex gap-2">
              <button class="btn btn-sm btn-outline-primary px-2 py-1" (click)="editCategory(row.id)" *ngIf="canEdit" [title]="'::Edit' | abpLocalization">
                <i class="fa fa-edit"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger px-2 py-1" (click)="deleteCategory(row.id)" *ngIf="canDelete" [title]="'::Delete' | abpLocalization">
                <i class="fa fa-trash"></i>
              </button>
            </div>
          </ng-template>
        </ngx-datatable-column>
      </ngx-datatable>
    </div>
  </div>

  <!-- Create/Edit Modal (Đã lược bỏ nút gạt isActive) -->
  <abp-modal [(visible)]="isModalOpen" *ngIf="canCreate || canEdit">
    <ng-template #abpHeader>
      <h3 class="modal-title fs-5 fw-bold">
        {{ selectedCategory?.id ? ('::Edit' | abpLocalization) : ('::Create' | abpLocalization) }}
      </h3>
    </ng-template>

    <ng-template #abpBody>
      <form id="category-form" *ngIf="form" [formGroup]="form" (ngSubmit)="saveCategory()">
        <div class="mb-3">
          <label class="form-label required fw-semibold">{{ '::Name' | abpLocalization }}</label>
          <input type="text" class="form-control" formControlName="name" autofocus [placeholder]="'::Name' | abpLocalization" />
          <div
            class="text-danger small mt-1"
            *ngIf="form.get('name')?.invalid && (form.get('name')?.dirty || form.get('name')?.touched)"
          >
            {{ '::AreYouSure' | abpLocalization }}
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ '::Description' | abpLocalization }}</label>
          <textarea
            class="form-control"
            formControlName="description"
            rows="3"
            [placeholder]="'::Description' | abpLocalization"
          ></textarea>
        </div>
      </form>
    </ng-template>

    <ng-template #abpFooter>
      <button type="button" class="btn btn-outline-secondary px-4" abpClose>{{ '::Cancel' | abpLocalization }}</button>
      <button form="category-form" type="submit" class="btn btn-primary px-4 d-inline-flex align-items-center gap-1 shadow-sm" [disabled]="form?.invalid || isSaving">
        <i class="fa fa-check"></i> <span>{{ '::Save' | abpLocalization }}</span>
      </button>
    </ng-template>
  </abp-modal>
</abp-page>
