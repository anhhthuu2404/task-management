<div class="card shadow-sm">
  <div class="card-header bg-white py-3">
    <h4 class="card-title text-primary m-0 fw-bold">
      <i class="fas" [ngClass]="isEditMode ? 'fa-edit' : 'fa-plus-circle'"></i>
      {{ isEditMode ? 'Chỉnh sửa công việc' : 'Thêm mới công việc' }}
    </h4>
  </div>

  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <!-- Tiêu đề -->
      <div class="mb-3">
        <label class="form-label fw-bold">Tiêu đề công việc <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="title"
          placeholder="Nhập tiêu đề công việc..."
        />
        <div
          class="text-danger mt-1 small"
          *ngIf="form.get('title')?.invalid && (form.get('title')?.dirty || form.get('title')?.touched)"
        >
          Vui lòng nhập tiêu đề công việc (tối đa 128 ký tự).
        </div>
      </div>

      <div class="row">
        <!-- Danh mục -->
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Danh mục <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="categoryId">
            <option value="">-- Chọn danh mục --</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
          <div
            class="text-danger mt-1 small"
            *ngIf="form.get('categoryId')?.invalid && (form.get('categoryId')?.dirty || form.get('categoryId')?.touched)"
          >
            Vui lòng chọn danh mục công việc.
          </div>
        </div>

        <!-- Người thực hiện -->
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Người thực hiện</label>
          <select class="form-select" formControlName="assigneeId">
            <option [ngValue]="null">-- Chưa phân công --</option>
            <option *ngFor="let user of users" [value]="user.id">
              {{ user.name || user.userName }}
            </option>
          </select>
        </div>
      </div>

      <div class="row">
        <!-- Mức độ ưu tiên -->
        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Mức độ ưu tiên <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="priority">
            <option [ngValue]="0">Thấp</option>
            <option [ngValue]="1">Trung bình</option>
            <option [ngValue]="2">Cao</option>
            <option [ngValue]="3">Khẩn cấp</option>
          </select>
        </div>

        <!-- Trạng thái -->
        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Trạng thái <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="status">
            <option [ngValue]="0">Mới tạo</option>
            <option [ngValue]="1">Đang thực hiện</option>
            <option [ngValue]="2">Hoàn thành</option>
            <option [ngValue]="3">Đã hủy</option>
          </select>
        </div>

        <!-- Hạn hoàn thành -->
        <div class="col-md-4 mb-3">
          <label class="form-label fw-bold">Hạn hoàn thành</label>
          <input type="date" class="form-control" formControlName="dueDate" />
        </div>
      </div>

      <!-- Mô tả -->
      <div class="mb-3">
        <label class="form-label fw-bold">Mô tả công việc</label>
        <textarea
          class="form-control"
          rows="3"
          formControlName="description"
          placeholder="Nhập chi tiết nội dung công việc..."
        ></textarea>
      </div>

      <!-- Chọn File đính kèm -->
      <div class="mb-3">
        <label class="form-label fw-bold">File đính kèm</label>
        <input type="file" class="form-control" (change)="onFileSelected($event)" />

        <div *ngIf="currentFileName && !selectedFile" class="mt-2 text-muted small">
          <i class="fas fa-paperclip me-1"></i> File hiện tại: <strong>{{ currentFileName }}</strong>
        </div>

        <div *ngIf="selectedFile" class="mt-2 text-success small">
          <i class="fas fa-check-circle me-1"></i> Đã chọn file mới: <strong>{{ selectedFile.name }}</strong>
        </div>
      </div>

      <!-- Nút thao tác -->
      <div class="d-flex gap-2 justify-content-end mt-4">
        <a routerLink="/tasks" class="btn btn-outline-secondary">
          <i class="fas fa-arrow-left me-1"></i> Quay lại
        </a>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid || isSubmitting">
          <i class="fas fa-save me-1"></i>
          {{ isSubmitting ? 'Đang lưu...' : (isEditMode ? 'Cập nhật' : 'Tạo mới') }}
        </button>
      </div>
    </form>
  </div>
</div>
