<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-primary m-0">Quản lý Phòng ban</h2>
    <button type="button" class="btn btn-primary shadow-sm" (click)="openCreateModal(null)">
      Thêm phòng ban gốc
    </button>
  </div>

  <div class="card shadow-sm p-4 border-0">
    <ng-template #treeNodelet let-nodes>
      <ul class="list-unstyled ps-4 border-start border-2 ms-2 my-2">
        <li *ngFor="let node of nodes" class="my-3">
          <div class="p-3 bg-white border rounded shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <div>
                <span class="badge bg-primary-subtle text-primary fs-6 me-2">[{{ node.code }}]</span>
                <span class="fw-bold text-dark fs-6">{{ node.name }}</span>
              </div>

              <!-- Nhóm nút vuông SVG chuẩn UI -->
              <div class="d-flex gap-2">
                <!-- Thêm thành viên -->
                <button type="button" class="btn btn-outline-primary p-0 d-flex align-items-center justify-content-center rounded-3" style="width: 38px; height: 38px;" (click)="openAssignModal(node)" title="Thêm thành viên">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm.5-5v1h1a.5.5 0 0 1 0 1h-1v1a.5.5 0 0 1-1 0v-1h-1a.5.5 0 0 1 0-1h1v-1a.5.5 0 0 1 1 0Zm-2-6a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/>
                    <path d="M8.256 14a4.474 4.474 0 0 1-.229-1.004H3c.001-.246.154-.986.832-1.664C4.484 10.68 5.711 10 8 10c.26 0 .507.009.74.025.226-.341.496-.65.804-.918C8.844 9.03 8.434 9 8 9c-5 0-6 3-6 4s1 1 1 1h5.256Z"/>
                  </svg>
                </button>

                <!-- Thêm con -->
                <button type="button" class="btn btn-outline-success p-0 d-flex align-items-center justify-content-center rounded-3" style="width: 38px; height: 38px;" (click)="openCreateModal(node.id)" title="Thêm con">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2Z"/>
                  </svg>
                </button>

                <!-- Sửa (Bút chì) -->
                <button type="button" class="btn btn-outline-primary p-0 d-flex align-items-center justify-content-center rounded-3" style="width: 38px; height: 38px;" (click)="openEditModal(node)" title="Sửa">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M12.854.146a.5.5 0 0 0-.707 0L10.5 1.793 14.207 5.5l1.647-1.646a.5.5 0 0 0 0-.708l-3-3zm.646 6.061L9.793 2.5 3.293 9 3.5 11.5 6 11.707l6.5-6.5zm-1.75 2.456-2-2L4 11.293V12h.707l4.397-4.337z"/>
                  </svg>
                </button>

                <!-- Xóa (Thùng rác) -->
                <button type="button" class="btn btn-outline-danger p-0 d-flex align-items-center justify-content-center rounded-3" style="width: 38px; height: 38px;" (click)="deleteDepartment(node.id)" title="Xóa">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5Zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6Z"/>
                    <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1ZM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118ZM2.5 3h11V2h-11v1Z"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Danh sách nhân sự thuộc phòng ban -->
            <div *ngIf="node.members && node.members.length > 0" class="mt-2 pt-2 border-top">
              <div class="text-muted small fw-bold mb-1">Thành viên:</div>
              <div class="d-flex flex-wrap gap-2">
                <span *ngFor="let member of node.members" class="badge bg-light text-dark border d-flex align-items-center gap-2 p-2">
                  <span [class.text-primary]="member.isManager" [class.fw-bold]="member.isManager">
                    {{ member.userName }} {{ member.isManager ? '(Quản lý)' : '' }}
                  </span>
                  <button type="button" class="btn-close btn-close-sm" style="font-size: 10px;" (click)="removeUserFromDept(node.id, member.userId)" title="Xóa khỏi phòng ban"></button>
                </span>
              </div>
            </div>
          </div>

          <ng-container *ngIf="node.children && node.children.length > 0">
            <ng-container *ngTemplateOutlet="treeNodelet; context: { $implicit: node.children }"></ng-container>
          </ng-container>
        </li>
      </ul>
    </ng-template>

    <ng-container *ngTemplateOutlet="treeNodelet; context: { $implicit: departments }"></ng-container>
    <div *ngIf="departments.length === 0" class="text-center text-muted py-5">
      Chưa có dữ liệu phòng ban nào.
    </div>
  </div>

  <!-- Modal Form Thêm/Sửa Phòng ban -->
  <div *ngIf="isModalOpen" class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5); z-index: 1050;">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg border-0">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">{{ isEditMode ? 'Cập nhật Phòng ban' : 'Thêm mới Phòng ban' }}</h5>
          <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-bold">Mã phòng ban <span class="text-danger">*</span></label>
            <input [(ngModel)]="formData.code" type="text" class="form-control" placeholder="VD: PB-HR" />
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Tên phòng ban <span class="text-danger">*</span></label>
            <input [(ngModel)]="formData.name" type="text" class="form-control" placeholder="VD: Phòng Nhân sự" />
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" (click)="closeModal()">Hủy</button>
          <button type="button" class="btn btn-primary" [disabled]="!formData.code || !formData.name" (click)="saveDepartment()">Lưu</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Gán User -->
  <div *ngIf="isAssignModalOpen" class="modal fade show d-block" tabindex="-1" style="background: rgba(0,0,0,0.5); z-index: 1050;">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg border-0">
        <div class="modal-header bg-success text-white">
          <h5 class="modal-title fw-bold">Thêm thành viên</h5>
          <button type="button" class="btn-close btn-close-white" (click)="closeAssignModal()"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Phòng ban: <span class="fw-bold text-primary">{{ selectedDepartment?.name }}</span></p>
          <div class="mb-3">
            <label class="form-label fw-bold">Chọn nhân sự <span class="text-danger">*</span></label>
            <select [(ngModel)]="assignData.userId" class="form-select">
              <option value="">-- Chọn User --</option>
              <option *ngFor="let user of availableUsers" [value]="user.id">{{ user.userName }} ({{ user.email }})</option>
            </select>
          </div>
          <div class="form-check mb-2">
            <input [(ngModel)]="assignData.isManager" type="checkbox" class="form-check-input" id="isManagerCheck" />
            <label class="form-check-label fw-semibold" for="isManagerCheck">Chỉ định làm Quản lý phòng ban</label>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-secondary" (click)="closeAssignModal()">Hủy</button>
          <button type="button" class="btn btn-success" [disabled]="!assignData.userId" (click)="saveAssignUser()">Xác nhận</button>
        </div>
      </div>
    </div>
  </div>
</div>
